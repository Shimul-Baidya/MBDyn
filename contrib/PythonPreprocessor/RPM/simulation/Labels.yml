# File with convention for labels 

###COMPONENTS 
# Each sub-component in the assembly phase takes the parent component label as first part of the label.
# For example, each node, element, reference system associated to a blade (subcomponent of parent component rotor) 
# has a label that starts with ROTOR + CURR_BLADE +..., where 'ROTOR'=ROTOR_n, 'CURR_BLADE'='BLADE_n' and 
# BLADE_n=n*CURR_BLADE

# Apart from a set of base labels, labels for repeated components and subcomponents are generated depending on the actual number of 
# repetitions for the specific model considered

###JOINTS, DRIVERS, SOCKETS (#TODO other?)
# All joint labels are associated to a progressive value starting from CURR_JOINT
# All driver labels are associated to a progressive value starting from CURR_DRIVER
# All socket labels are associated to a progressive value starting from CURR_SOCKET
# All lumped masses labels are associated to a progressive value starting from CURR_LUMPEDMASS

# MBDyn_label_gen.py generates labels.set for the model 


